name: DSH Desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Desktop source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Run desktop tests
        run: pnpm run test:desktop

      - name: Build desktop main process
        run: pnpm run build:desktop

      - name: Check TypeScript projects
        run: pnpm run typecheck

      - name: Check documentation
        run: pnpm run doc-sync

      - name: Reject generated drift
        run: git diff --exit-code

  package-smoke:
    name: Package smoke / ${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned local application
        run: pnpm run desktop:app:mac:${{ matrix.arch }}

      - name: Verify application bundle exists
        run: test -n "$(find apps/desktop/dist -type d -name 'DSH Desktop.app' -print -quit)"
