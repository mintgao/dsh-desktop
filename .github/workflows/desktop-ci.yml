name: DSH Desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: One-time reviewed finalizer installation
        type: boolean
        default: false
      probe:
        description: One-time harmless draft access probe
        type: boolean
        default: false
      plan:
        description: Exact reviewed operation JSON
        type: string
      digest:
        description: Reviewed operation SHA256
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.bootstrap == true || inputs.probe == true) && 'desktop-delivery-bootstrap-dispatch' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ inputs.bootstrap != true && inputs.probe != true }}

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    if: inputs.bootstrap != true && inputs.probe != true
    name: Desktop source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Run desktop tests
        run: pnpm run test:desktop

      - name: Build desktop main process
        run: pnpm run desktop:stage

      - name: Check TypeScript projects
        run: pnpm run typecheck

      - name: Check documentation
        run: pnpm run doc-sync

      - name: Reject generated drift
        run: git diff --exit-code

  package-smoke:
    name: Package smoke / ${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap != true && inputs.probe != true
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned local application
        run: pnpm run desktop:app:mac:${{ matrix.arch }}

      - name: Smoke packaged updater module
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find apps/desktop-mint/dist -type d -name 'DSH Desktop.app' -print -quit)"
          test -n "$app_path"
          smoke_home="$(mktemp -d "$RUNNER_TEMP/mint-smoke.XXXXXX")"
          mkdir -p "$smoke_home/tmp" "$smoke_home/home"
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$smoke_home/home" CFFIXED_USER_HOME="$smoke_home/home" TMPDIR="$smoke_home/tmp" MAC_CHROMIUM_TMPDIR="$smoke_home/tmp" DSH_HOME="$smoke_home/home/.dsh" DSH_AGENTS_HOME="$smoke_home/home/.agents" "$app_path/Contents/MacOS/DSH Desktop" --user-data-dir="$smoke_home/userdata" --dsh-package-smoke
          rm -rf "$smoke_home"

  bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap == true && inputs.probe != true
    environment: mint-delivery-bootstrap
    concurrency:
      group: desktop-delivery-bootstrap
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Execute only the explicitly approved immutable bootstrap operation
        env:
          PLAN: ${{ inputs.plan }}
          DIGEST: ${{ inputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$PLAN" > "$RUNNER_TEMP/plan.json"
          node --import tsx scripts/desktop-delivery/cli.ts bootstrap-apply --config .github/desktop-delivery/mint.json --plan "$RUNNER_TEMP/plan.json" --digest "$DIGEST" --apply --out "$RUNNER_TEMP/result.json" --summary "$RUNNER_TEMP/result.md"
      - if: always()
        run: test ! -f "$RUNNER_TEMP/result.md" || cat "$RUNNER_TEMP/result.md" >> "$GITHUB_STEP_SUMMARY"

  draft-access-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.probe == true && inputs.bootstrap != true
    environment: mint-delivery-bootstrap
    concurrency:
      group: desktop-delivery-bootstrap
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Execute only the explicitly approved immutable bootstrap operation
        env:
          PLAN: ${{ inputs.plan }}
          DIGEST: ${{ inputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$PLAN" > "$RUNNER_TEMP/plan.json"
          node --import tsx scripts/desktop-delivery/cli.ts bootstrap-probe --config .github/desktop-delivery/mint.json --plan "$RUNNER_TEMP/plan.json" --digest "$DIGEST" --apply --out "$RUNNER_TEMP/result.json" --summary "$RUNNER_TEMP/result.md"
      - if: always()
        run: test ! -f "$RUNNER_TEMP/result.md" || cat "$RUNNER_TEMP/result.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-draft-access-probe
          path: ${{ runner.temp }}/result.json
          retention-days: 30
