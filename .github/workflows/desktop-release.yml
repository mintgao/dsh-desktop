name: Release DSH Desktop

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing desktop-v* tag to build
        required: true
        type: string
      publish:
        description: Publish immediately after every release check passes
        required: true
        default: false
        type: boolean
      upstream_ref:
        description: Adopted upstream dsh-v* release tag
        required: false
        type: string
      upstream_commit:
        description: Adopted upstream release commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  prepare:
    name: Select release channel
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      upstream_commit: ${{ steps.release.outputs.upstream_commit }}
      upstream_ref: ${{ steps.release.outputs.upstream_ref }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate desktop tag
        id: release
        shell: bash
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          version="${tag#desktop-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be desktop-v followed by a semantic version." >&2
            exit 1
          fi
          if [[ "$PUBLISH_REQUESTED" == true && ( -z "$UPSTREAM_REF" || -z "$UPSTREAM_COMMIT" ) ]]; then
            echo 'An automatic publication requires its upstream tag and commit.' >&2
            exit 1
          fi
          mode=signed
          if [[ "$version" == *-* ]]; then
            mode=preview
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH_REQUESTED:-false}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=${UPSTREAM_COMMIT:-not-recorded}" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=${UPSTREAM_REF:-not-recorded}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: macOS artifacts / ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate signing secrets
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required release secret: $name" >&2
              exit 1
            fi
          done

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Stage source-built DSH runtime
        run: pnpm run desktop:stage

      - name: Build, sign, and notarize DMG and update ZIP
        if: needs.prepare.outputs.mode == 'signed'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: >-
          pnpm exec electron-builder
          --config apps/desktop/electron-builder.yml
          --config.extraMetadata.version=${{ needs.prepare.outputs.version }}
          --config.forceCodeSigning=true
          --config.mac.notarize=true
          --mac dmg zip
          --${{ matrix.arch }}
          --publish never

      - name: Build, sign, and notarize preview DMG
        if: needs.prepare.outputs.mode == 'preview'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: >-
          pnpm exec electron-builder
          --config apps/desktop/electron-builder.yml
          --config.extraMetadata.version=${{ needs.prepare.outputs.version }}
          --config.forceCodeSigning=true
          --config.mac.notarize=true
          --mac dmg
          --${{ matrix.arch }}
          --publish never

      - name: Verify architecture DMG
        shell: bash
        run: test -f "apps/desktop/dist/DSH-Desktop-Mint-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.dmg"

      - name: Smoke packaged updater module
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find apps/desktop/dist -type d -name 'DSH Desktop.app' -print -quit)"
          test -n "$app_path"
          "$app_path/Contents/MacOS/DSH Desktop" --dsh-package-smoke

      - name: Verify Developer ID application signature
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find apps/desktop/dist -type d -name 'DSH Desktop.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signing_details="$(codesign -dvvv --verbose=4 "$app_path" 2>&1)"
          if [[ "$signing_details" != *"Authority=Developer ID Application:"* ]]; then
            echo "Desktop artifact is not signed by a Developer ID Application identity." >&2
            exit 1
          fi
          if [[ "$signing_details" == *"Signature=adhoc"* ]]; then
            echo "Desktop artifact has only an ad-hoc signature." >&2
            exit 1
          fi

      - name: Verify notarization ticket
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="apps/desktop/dist/DSH-Desktop-Mint-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.dmg"
          xcrun stapler validate "$dmg_path"
          spctl --assess --verbose=2 --type open "$dmg_path"

      - name: Preserve architecture update metadata
        if: needs.prepare.outputs.mode == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/desktop/dist/latest-mac.yml
          test -f "apps/desktop/dist/DSH-Desktop-Mint-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.zip"
          test -f "apps/desktop/dist/DSH-Desktop-Mint-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.zip.blockmap"
          mv apps/desktop/dist/latest-mac.yml "apps/desktop/dist/latest-mac-${{ matrix.arch }}.yml"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac-${{ matrix.arch }}.yml
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v4
        if: needs.prepare.outputs.mode == 'signed'

      - uses: actions/setup-node@v6
        if: needs.prepare.outputs.mode == 'signed'
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install immutable dependencies
        if: needs.prepare.outputs.mode == 'signed'
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v5
        with:
          pattern: dsh-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Merge architecture update metadata
        if: needs.prepare.outputs.mode == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/merge-desktop-update-metadata.ts \
            --version "${{ needs.prepare.outputs.version }}" \
            --output release-assets/latest-mac.yml \
            release-assets/latest-mac-arm64.yml \
            release-assets/latest-mac-x64.yml

      - name: Write signed release checksums
        if: needs.prepare.outputs.mode == 'signed'
        run: |
          cd release-assets
          sha256sum *.dmg *.zip > SHA256SUMS.txt

      - name: Write preview release checksums
        if: needs.prepare.outputs.mode == 'preview'
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            sha256sum *.dmg > SHA256SUMS.txt
          )

      - name: Write release notes
        shell: bash
        env:
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          UPSTREAM_COMMIT: ${{ needs.prepare.outputs.upstream_commit }}
          UPSTREAM_REF: ${{ needs.prepare.outputs.upstream_ref }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          template=.github/desktop-stable-release-notes.md
          if [[ "$RELEASE_MODE" == preview ]]; then
            template=.github/desktop-preview-release-notes.md
          fi
          source_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          sed \
            -e "s|__VERSION__|$VERSION|g" \
            -e "s|__UPSTREAM_REF__|$UPSTREAM_REF|g" \
            -e "s|__UPSTREAM_COMMIT__|$UPSTREAM_COMMIT|g" \
            -e "s|__SOURCE_COMMIT__|$source_commit|g" \
            "$template" > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            release-assets/*.dmg
            release-assets/SHA256SUMS.txt
          )
          options=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "DSH Desktop Mint $VERSION"
            --notes-file release-notes.md
          )
          if [[ "$RELEASE_MODE" == signed ]]; then
            assets+=(
              release-assets/*.zip
              release-assets/*.blockmap
              release-assets/latest-mac.yml
            )
            if [[ "$PUBLISH" == true ]]; then
              options+=(--latest)
            fi
          else
            options+=(--prerelease)
          fi
          if [[ "$PUBLISH" != true ]]; then
            options+=(--draft)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" "${options[@]}"
