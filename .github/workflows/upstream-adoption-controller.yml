name: Reconcile upstream adoption

on:
  schedule:
    - cron: '17,47 * * * *'
  repository_dispatch:
    types: [upstream-adoption-project-failure, upstream-adoption-project-state, upstream-adoption-project-success]
  workflow_dispatch:
    inputs:
      queue_head:
        description: Exact active dsh-v* tag, or idle when resuming the idle circuit
        required: false
        type: string
      reason:
        description: Required reason for a forced attempt
        required: false
        type: string
      resume:
        description: Resume an explicitly paused queue head
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: upstream-adoption-controller
  cancel-in-progress: false

jobs:
  activation:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.mode.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: mode
        name: Select configured controller mode
        env:
          ENABLED: ${{ vars.UPSTREAM_ADOPTION_ENABLED }}
        run: |
          if [[ "$ENABLED" == true ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Upstream adoption is safely unconfigured; no mutation was attempted.' >> "$GITHUB_STEP_SUMMARY"
          fi

  reconcile:
    if: >-
      needs.activation.outputs.enabled == 'true'
      && github.repository == 'mintgao/dsh-desktop'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: activation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: controller-token
        with:
          app-id: ${{ vars.MINT_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.MINT_CONTROLLER_APP_PRIVATE_KEY }}

      - name: Reject incomplete manual force
        env:
          QUEUE_HEAD: ${{ inputs.queue_head }}
          REASON: ${{ inputs.reason }}
          RESUME: ${{ inputs.resume }}
        run: |
          if [[ -n "$QUEUE_HEAD" || -n "$REASON" || "$RESUME" == true ]]; then
            test -n "$QUEUE_HEAD"
            test -n "$REASON"
          fi

      - name: Fetch protected adoption state
        run: |
          git fetch origin refs/heads/automation/upstream-adoption-state:refs/remotes/origin/automation/upstream-adoption-state
          git show refs/remotes/origin/automation/upstream-adoption-state:state/upstream-adoption.json > "$RUNNER_TEMP/upstream-adoption.json"
          pnpm exec tsx scripts/upstream-adoption/cli.ts validate-state "$RUNNER_TEMP/upstream-adoption.json"

      - name: Reconcile queue-head phase
        env:
          CONTROLLER_TOKEN: ${{ steps.controller-token.outputs.token }}
          GH_TOKEN: ${{ steps.controller-token.outputs.token }}
          QUEUE_HEAD: ${{ inputs.queue_head }}
          REASON: ${{ inputs.reason }}
          RESUME: ${{ inputs.resume }}
          CONTROLLER_APP_ID: ${{ vars.MINT_CONTROLLER_APP_ID }}
          CONTROLLER_APP_SLUG: ${{ vars.MINT_CONTROLLER_APP_SLUG }}
        run: bash scripts/upstream-adoption/controller-reconcile.sh

  project-failure:
    if: github.repository == 'mintgao/dsh-desktop' && github.event.action == 'upstream-adoption-project-failure'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: controller-token
        with:
          app-id: ${{ vars.MINT_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.MINT_CONTROLLER_APP_PRIVATE_KEY }}
      - name: Re-derive the failure and project at most one blocker Issue
        env:
          DURABLE: ${{ github.event.client_payload.durable }}
          EXPECTED_FINGERPRINT: ${{ github.event.client_payload.fingerprint }}
          EXPECTED_PHASE: ${{ github.event.client_payload.phase }}
          EXPECTED_QUEUE_HEAD: ${{ github.event.client_payload.queue_head }}
          GH_TOKEN: ${{ steps.controller-token.outputs.token }}
          SOURCE_RUN: ${{ github.event.client_payload.source_run }}
        run: |
          issue_number_by_title() {
            local desired_title="$1"
            local issue_state="$2"
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=$issue_state&per_page=100" --slurp \
              | jq -r --arg title "$desired_title" '[.[][] | select(has("pull_request") | not) | select(.title == $title)][0].number // empty'
          }
          test -n "$SOURCE_RUN"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" --slurp \
            | jq '[.[].jobs[]] | {
                failedChecks: ([.[] | select(.conclusion != "success" and .conclusion != "skipped") as $job
                  | (($job.steps // []) | map(select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != null)
                    | ($job.name + " / " + .name))) as $steps
                  | if ($steps | length) == 0 then $job.name else $steps[] end] | unique | sort)
              }' > "$RUNNER_TEMP/source-failure-input.json"
          jq -e --argjson repository "$GITHUB_REPOSITORY_ID" '
            .repository.id == $repository
            and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != null)
            and (.path == ".github/workflows/upstream-adoption-controller.yml"
              or .path == ".github/workflows/upstream-adoption-finalizer.yml"
              or .path == ".github/workflows/upstream-adoption-validation.yml"
              or .path == ".github/workflows/desktop-release.yml")
          ' "$RUNNER_TEMP/source-run.json"
          controller_cleanup=false
          if jq -e '.path == ".github/workflows/upstream-adoption-controller.yml" and .event == "repository_dispatch"' "$RUNNER_TEMP/source-run.json" >/dev/null; then
            if jq -e '.failedChecks[] | startswith("Verify delivery, close its Issue, and remove its candidate branch")' "$RUNNER_TEMP/source-failure-input.json" >/dev/null; then
              controller_cleanup=true
            else
              echo 'Controller projection failures are not observed recursively.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          queue_head=''
          phase=control-plane-blocked
          fingerprint=''
          if git fetch origin refs/heads/automation/upstream-adoption-state; then
            git show refs/remotes/origin/automation/upstream-adoption-state:state/upstream-adoption.json > "$RUNNER_TEMP/state.json"
            queue_head="$(jq -r '.activeDelivery.upstream.tag // empty' "$RUNNER_TEMP/state.json")"
            phase="$(jq -r '.activeDelivery.phase // "control-plane-blocked"' "$RUNNER_TEMP/state.json")"
            fingerprint="$(jq -r '.activeDelivery.failure.fingerprint // empty' "$RUNNER_TEMP/state.json")"
          fi
          if [[ "$DURABLE" == true ]]; then
            test -n "$queue_head"
            test "$queue_head" = "$EXPECTED_QUEUE_HEAD"
            test "$phase" = "$EXPECTED_PHASE"
            test -n "$fingerprint"
            test "$fingerprint" = "$EXPECTED_FINGERPRINT"
            recovery='Fix the exact blocker or change an authoritative input, then dispatch the Controller with this queue-head tag and a reason. Unchanged scheduled polls are successful no-ops.'
            automation='enabled; the protected deterministic state prevents duplicate execution'
            title="Blocked: deliver DeepSeek Harness $queue_head"
          elif [[ "$controller_cleanup" == true ]]; then
            queue_head="${queue_head:-${EXPECTED_QUEUE_HEAD:-unknown-queue-head}}"
            phase="${EXPECTED_PHASE:-cleanup-blocked}"
            if [[ -z "$fingerprint" ]]; then
              fingerprint="$(jq -n --slurpfile run "$RUNNER_TEMP/source-run.json" --slurpfile failure "$RUNNER_TEMP/source-failure-input.json" '[($run[0].path),($run[0].conclusion),($failure[0].failedChecks)] | @json' | sha256sum | cut -d ' ' -f 1)"
            fi
            recovery='Publication already succeeded. The scheduled Controller retries exact cleanup debt until the blocker Issue, candidate PR, and branch are closed exactly once.'
            automation='publication is complete; scheduled reconciliation keeps retrying cleanup debt until it succeeds'
            title="Blocked: deliver DeepSeek Harness $queue_head"
          else
            queue_head="${queue_head:-${EXPECTED_QUEUE_HEAD:-unknown-queue-head}}"
            phase="${EXPECTED_PHASE:-control-plane-blocked}"
            if [[ -z "$fingerprint" ]]; then
              fingerprint="$(jq -r '[.path,.conclusion] | join(":")' "$RUNNER_TEMP/source-run.json" | sha256sum | cut -d ' ' -f 1)"
            fi
            recovery='Repair the control-plane or policy failure, run the zero-mutation preflight, then close this circuit-breaker Issue or manually resume the Controller.'
            automation='Scheduled reconciliations are successful no-ops until this circuit-breaker Issue is closed or the Controller is manually resumed.'
            title='Blocked: upstream adoption control plane'
          fi
          source_path="$(jq -r '.path' "$RUNNER_TEMP/source-run.json")"
          conclusion="$(jq -r '.conclusion' "$RUNNER_TEMP/source-run.json")"
          printf -v body 'Queue head: `%s`\nPhase: `%s`\nFailure: `%s` in `%s`\nFingerprint: `%s`\nAutomation: %s\nWorkflow: https://github.com/%s/actions/workflows/%s\n\nRecovery: %s' \
            "$queue_head" "$phase" "$conclusion" "$source_path" "$fingerprint" "$automation" "$GITHUB_REPOSITORY" "${source_path##*/}" "$recovery"
          issue="$(issue_number_by_title "$title" open)"
          if [[ -z "$issue" ]]; then
            gh issue create --title "$title" --body "$body"
          else
            current="$(gh issue view "$issue" --json title,body --jq '[.title,.body] | @tsv')"
            desired="$(printf '%s\t%s' "$title" "$body")"
            if [[ "$current" != "$desired" ]]; then gh issue edit "$issue" --title "$title" --body "$body"; fi
          fi

  project-state:
    if: github.repository == 'mintgao/dsh-desktop' && github.event.action == 'upstream-adoption-project-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: controller-token
        with:
          app-id: ${{ vars.MINT_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.MINT_CONTROLLER_APP_PRIVATE_KEY }}
      - name: Project the exact durable blocker without comments
        env:
          EXPECTED_QUEUE_HEAD: ${{ github.event.client_payload.queue_head }}
          GH_TOKEN: ${{ steps.controller-token.outputs.token }}
        run: |
          git fetch origin refs/heads/automation/upstream-adoption-state
          git show refs/remotes/origin/automation/upstream-adoption-state:state/upstream-adoption.json > "$RUNNER_TEMP/state.json"
          pnpm exec tsx scripts/upstream-adoption/cli.ts validate-state "$RUNNER_TEMP/state.json"
          queue_head="$(jq -r '.activeDelivery.upstream.tag' "$RUNNER_TEMP/state.json")"
          phase="$(jq -r '.activeDelivery.phase' "$RUNNER_TEMP/state.json")"
          test "$queue_head" = "$EXPECTED_QUEUE_HEAD"
          case "$phase" in adoption-blocked|candidate-stale|publication-blocked) ;; *) exit 0 ;; esac
          fingerprint="$(jq -r '.activeDelivery.failure.fingerprint' "$RUNNER_TEMP/state.json")"
          stage="$(jq -r '.activeDelivery.failure.stage' "$RUNNER_TEMP/state.json")"
          failure_class="$(jq -r '.activeDelivery.failure.failureClass' "$RUNNER_TEMP/state.json")"
          pr="$(jq -r '.activeDelivery.candidate.pr // empty' "$RUNNER_TEMP/state.json")"
          workflow_run="$(jq -r '.activeDelivery.publicationRun // .updateRunId' "$RUNNER_TEMP/state.json")"
          title="Blocked: deliver DeepSeek Harness $queue_head"
          printf -v body 'Queue head: `%s`\nPhase: `%s`\nFailure: `%s` in `%s`\nFingerprint: `%s`\nIntegration PR: %s\nWorkflow run: https://github.com/%s/actions/runs/%s\n\nRecovery: resolve the exact blocker on the candidate PR or change an authoritative input. An exact-head approval must come from a collaborator with maintain or admin permission. Unchanged scheduled polls are successful no-ops.' \
            "$queue_head" "$phase" "$failure_class" "$stage" "$fingerprint" "${pr:+#$pr}" "$GITHUB_REPOSITORY" "$workflow_run"
          issue="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" --slurp | jq -r --arg title "$title" '[.[][] | select(has("pull_request") | not) | select(.title == $title)][0].number // empty')"
          if [[ -z "$issue" ]]; then
            gh issue create --title "$title" --body "$body"
          else
            if [[ "$(gh issue view "$issue" --json state --jq '.state')" != OPEN ]]; then gh issue reopen "$issue"; fi
            current="$(gh issue view "$issue" --json title,body --jq '[.title,.body] | @tsv')"
            desired="$(printf '%s\t%s' "$title" "$body")"
            if [[ "$current" != "$desired" ]]; then gh issue edit "$issue" --title "$title" --body "$body"; fi
          fi

  project-success:
    if: github.repository == 'mintgao/dsh-desktop' && github.event.action == 'upstream-adoption-project-success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: controller-token
        with:
          app-id: ${{ vars.MINT_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.MINT_CONTROLLER_APP_PRIVATE_KEY }}
      - name: Verify delivery, close its Issue, and remove its candidate branch
        env:
          DESKTOP_TAG: ${{ github.event.client_payload.desktop_tag }}
          GH_TOKEN: ${{ steps.controller-token.outputs.token }}
          QUEUE_HEAD: ${{ github.event.client_payload.queue_head }}
        run: |
          issue_number_by_title() {
            local desired_title="$1"
            local issue_state="$2"
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=$issue_state&per_page=100" --slurp \
              | jq -r --arg title "$desired_title" '[.[][] | select(has("pull_request") | not) | select(.title == $title)][0].number // empty'
          }
          test -n "$QUEUE_HEAD"
          test -n "$DESKTOP_TAG"
          git fetch origin refs/heads/automation/upstream-adoption-state
          git show refs/remotes/origin/automation/upstream-adoption-state:state/upstream-adoption.json > "$RUNNER_TEMP/state.json"
          test "$(jq -r '.activeDelivery == null' "$RUNNER_TEMP/state.json")" = true
          test "$(jq -r '.lastPublishedRelease.tag' "$RUNNER_TEMP/state.json")" = "$QUEUE_HEAD"
          test "$(jq -r '.lastPublishedRelease.desktopTag' "$RUNNER_TEMP/state.json")" = "$DESKTOP_TAG"
          gh release view "$DESKTOP_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName | jq -e --arg tag "$DESKTOP_TAG" 'select(.isDraft == false and .tagName == $tag)'
          blocked_title="Blocked: deliver DeepSeek Harness $QUEUE_HEAD"
          issue="$(issue_number_by_title "$blocked_title" open)"
          if [[ -n "$issue" ]]; then
            body="Delivered \`$QUEUE_HEAD\` as verified public Release \`$DESKTOP_TAG\`. The protected publication cursor has advanced; later upstream Releases remain ordered behind it."
            gh issue edit "$issue" --body "$body"
            gh issue close "$issue" --reason completed
          fi
          candidate_branch="automation/adopt/${QUEUE_HEAD//[^0-9A-Za-z._-]/-}"
          pr="$(gh pr list --head "$candidate_branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$pr" ]]; then gh pr close "$pr" --comment "Delivered as $DESKTOP_TAG after verified publication."; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$candidate_branch" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$candidate_branch"
          fi
