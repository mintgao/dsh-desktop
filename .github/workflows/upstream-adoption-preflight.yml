name: Verify Mint release policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-only:
    if: github.repository == 'mintgao/dsh-desktop'
    environment: mint-finalizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require owner-authenticated activation files
        run: |
          jq -e '.schemaVersion == 1 and .status == "active"' .github/release-policy/activation.json
          test -s .github/release-policy/receipt.json
          test -s .github/release-policy/receipt.json.sig

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: finalizer-token
        with:
          app-id: ${{ vars.MINT_FINALIZER_APP_ID }}
          private-key: ${{ secrets.MINT_FINALIZER_APP_PRIVATE_KEY }}

      - name: Verify signed policy without mutation
        env:
          GH_TOKEN: ${{ steps.finalizer-token.outputs.token }}
        run: |
          pnpm exec tsx scripts/upstream-adoption/runtime-facts.ts \
            .github/release-policy/activation.json \
            .github/release-policy/receipt.json \
            finalizer \
            "$RUNNER_TEMP/runtime-policy-facts.json"
          pnpm exec tsx scripts/upstream-adoption/cli.ts verify-policy \
            .github/release-policy/activation.json \
            .github/release-policy/receipt.json \
            .github/release-policy/receipt.json.sig \
            "$RUNNER_TEMP/runtime-policy-facts.json"
          echo 'Owner-authenticated release policy passed the zero-mutation preflight.' >> "$GITHUB_STEP_SUMMARY"
