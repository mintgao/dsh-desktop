name: Legacy upstream sync is retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the migration
        run: |
          echo 'The direct upstream-sync scheduler is retired.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Use upstream-adoption-controller.yml after the owner-authenticated policy and protected state ref are activated.' >> "$GITHUB_STEP_SUMMARY"
